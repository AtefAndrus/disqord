# 運用メモ:
# - グループ PR が作られるのは weekly スケジュール実行と本ファイル変更時の即時実行のみ。
#   UI の「Check for updates」は単一エコシステムのジョブ（multi-ecosystem-update: false）で走り、
#   グループ PR は作成されない（No PRs affected になる）。
# - グループ PR には @dependabot rebase / recreate が効かない既知バグあり（dependabot-core#12903）。
#   PR が BEHIND になったら次回 weekly 実行での更新を待つ。
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7
