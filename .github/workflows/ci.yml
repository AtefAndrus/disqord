name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun の版が mise.toml(SSOT) と Dockerfile で完全一致するか検証（bun 不要・純テキスト）
      # 比較するのは実際に bun を供給する 2 経路だけ。開発 / CI は mise.toml、本番は Dockerfile の
      # base image が bun を決める。package.json の engines.bun はどちらにも関与せず
      # bun 自身も強制しないため、この検査のためだけに存在する値になっていたので削除した。
      #
      # 3 経路とも同じ patch を指すことを要求する。両側とも exact 指定にしてあり、
      # 片側だけを可変指定に戻すと、同じ minor 線の中で本番と開発の版が静かにずれる。
      # mise の `1.3` は 1.3 系の最新へ解決するため書き換えなしで浮動する。Docker 側は
      # digest を固定しているのでタグ再発行だけでは動かないが、可変タグ `1.3-slim` のまま
      # digest だけが更新されると、タグ表記が変わらないまま実イメージの patch が上がる。
      # どちらの経路も版表記の比較では捉えられないので、両側に 3 要素を要求する。
      # 3 要素にマッチしない値は可変指定へ戻った合図なので、その時点で落とす。
      #
      # bun-types も比較する。tsconfig.json の types が ["bun-types"] なので typecheck における
      # Bun API 型の唯一の供給源で、ランタイムより先行すると「型は通るが実行時に無い API」を
      # 受け入れる。Renovate 側は同じグループに入れてあるが、グループ化が保証するのは
      # 「同時に更新可能なものを 1 本の PR に載せる」ことだけで、版の一致は保証しない
      # (pin だけ別グループへ回る経路もある)。package.json の宣言ではなく bun.lock の
      # 解決結果を見るのは、レンジ指定のままでも実際に入る版を検査するため。
      #
      # 限界: Dockerfile はタグ文字列しか見ていない。digest は独立に固定されており、
      # 別バージョンの有効な digest を付けてもこの検査と docker build は通る。
      # タグと digest の対応まで検証するにはレジストリ照会が要るため、ここでは扱わない。
      - name: bun version drift check (mise SSOT)
        run: |
          mise_v=$(sed -nE 's/^bun[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' mise.toml)
          docker_v=$(sed -nE 's#^FROM oven/bun:([0-9]+\.[0-9]+\.[0-9]+)-slim@.*#\1#p' Dockerfile | head -n1)
          types_v=$(sed -nE 's/^[[:space:]]*"bun-types": \["bun-types@([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' bun.lock | head -n1)
          echo "mise=$mise_v dockerfile=$docker_v bun-types=$types_v"
          if [ -z "$mise_v" ] || [ -z "$docker_v" ]; then
            echo "::error::bun version must be pinned to an exact patch in both mise.toml and Dockerfile (mise=$mise_v dockerfile=$docker_v)"; exit 1
          fi
          if [ -z "$types_v" ]; then
            echo "::error::could not read the resolved bun-types version from bun.lock"; exit 1
          fi
          if [ "$mise_v" != "$docker_v" ] || [ "$mise_v" != "$types_v" ]; then
            echo "::error::bun version drift (mise=$mise_v dockerfile=$docker_v bun-types=$types_v)"; exit 1
          fi
      # biome.json の $schema が package.json(SSOT) と一致するか検証（bun 不要・純テキスト）
      # biome 自身も不一致を検出するが severity が info で exit 0 のため CI は緑のまま通る。
      # このジョブの役割は検出の追加ではなく、その info を落ちる失敗へ昇格させること。
      # $schema から版を抽出せず期待 URL 全体と文字列比較するのは、版の不一致だけでなく
      # ホスト・パス形状の破損も同時に捕まえるため。
      # レンジ接頭辞を剥がさず exact を要求するのは、剥がすと ^2.5.3 で実際に入る版が
      # $schema とずれても通過してしまうから。exact ピンは :pinDevDependencies の前提でもある。
      # 検証を jq の \A...\z で行うのは、grep が行単位で照合するため多行値の 1 行目だけが
      # 一致しても通過してしまうから。\A / \z は文字列全体をアンカーする。
      - name: biome schema drift check
        run: |
          pkg_v=$(jq -er '.devDependencies["@biomejs/biome"]
                          | select(type == "string" and test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z"))' package.json) || {
            echo "::error::@biomejs/biome must be pinned to an exact stable version like 2.5.3"; exit 1
          }
          expected="https://biomejs.dev/schemas/${pkg_v}/schema.json"
          echo "expected=$expected actual=$(jq -r '."$schema"' biome.json)"
          # 比較も jq 内で行う。シェルのコマンド置換は末尾改行を落とすため、
          # 値を取り出してから比べると末尾に改行が付いた $schema を取りこぼす。
          jq -e --arg expected "$expected" '."$schema" == $expected' biome.json > /dev/null || {
            echo "::error::biome schema drift (expected=$expected)"; exit 1
          }
      # mise.toml を SSOT に bun のみ取得（setup-bun は使わない。git-cliff は入れない）
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.14" # mise 本体を固定（既定 latest=可変）。Renovate が jdx/mise として更新する
          install_args: bun # bun のみ。git-cliff は CI に入れない
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint:md

  actions-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.30.0" # zizmor CLI 版を固定（既定 latest=可変）
          advanced-security: false # SARIF/GHAS アップロード無効化（security-events: write 昇格を回避）
          online-audits: false # 外部 API 参照を無効化（offline 運用）

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t disqord:ci .
