[changelog]
header = """# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{%- if version %}

## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}

## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim \
  | replace_regex(from="^\\[(?:feat|fix|docs|refactor|test|perf)\\]\\s*", to="") \
  | replace_regex(from="^(?:feat|fix|docs|refactor|test|perf)(?:\\(.*?\\))?:\\s*", to="") \
  | replace_regex(from="^build\\(deps(?:-dev)?\\):\\s*", to="") \
  | upper_first }}
{% endfor %}
{%- endfor %}
"""
footer = """
<!-- ends the last list, so the link definitions below are not read as part of its final item -->
{% for release in releases -%}
  {% if release.version -%}
    {% if release.previous.version -%}
      [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/AtefAndrus/disqord/compare/{{ release.previous.version }}...{{ release.version }}
    {% endif -%}
  {% else -%}
    [unreleased]: https://github.com/AtefAndrus/disqord/compare/{{ release.previous.version }}...HEAD
  {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Skip noise
  { message = "^Merge", skip = true },
  { message = '^\[release\]', skip = true },
  { message = '^\[chore\]', skip = true },
  # Bracket prefix format
  { message = '^\[feat\]', group = "<!-- 0 -->Added" },
  { message = '^\[fix\]', group = "<!-- 1 -->Fixed" },
  { message = '^\[docs\]', group = "<!-- 4 -->Documentation" },
  { message = '^\[refactor\]', group = "<!-- 3 -->Refactoring" },
  { message = '^\[test\]', group = "<!-- 5 -->Testing" },
  { message = '^\[perf\]', group = "<!-- 2 -->Performance" },
  # Bot-generated dependency updates (Renovate; Dependabot in older history)
  { message = '^build\(deps', group = "<!-- 6 -->Dependencies" },
  # Fallback (lowercase conventional-style from older commits)
  { message = '^feat', group = "<!-- 0 -->Added" },
  { message = '^fix', group = "<!-- 1 -->Fixed" },
  { message = '^docs', group = "<!-- 4 -->Documentation" },
]
