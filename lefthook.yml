pre-commit:
  piped: true
  commands:
    # main へ直コミットすると push 前に気付いても reset とブランチ作り直しの往復になる。
    # 判断を人手に委ねず既定で止める。意図的に行う場合は LEFTHOOK=0 git commit ...
    00_guard-branch:
      run: |
        # rev-parse ではなく symbolic-ref を使う。未コミットの main では rev-parse が HEAD を
        # 解決できず空を返し、case に一致せずガードが fail-open になる
        branch=$(git symbolic-ref --quiet --short HEAD || true)
        # マージコミット作成中は対象外。main で git pull がマージを作る場合に詰まらせない
        if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then exit 0; fi
        case "$branch" in
          main|master)
            echo "main への直コミットは既定で禁止。ブランチを切ること。"
            echo "意図的に行う場合は LEFTHOOK=0 git commit ..."
            exit 1 ;;
        esac
    01_generate-readme:
      run: bun scripts/generate-readme.ts && git add README.md AGENTS.md .env.example docs/progress.md
    02_lint:
      run: bun run lint
    03_lint-md:
      run: bun run lint:md
    04_typecheck:
      run: bun run typecheck
    05_test:
      run: bun test

# bun.lock が変わった後に node_modules が古いままだと、次のコミットの typecheck が
# 見つからないモジュールで落ちる。Renovate の PR で lockfile は頻繁に変わる。
post-merge:
  commands:
    bun-install:
      run: git diff --quiet ORIG_HEAD HEAD -- bun.lock || bun install --frozen-lockfile

post-checkout:
  commands:
    bun-install:
      # {3} はブランチの checkout なら 1、ファイル単位の checkout なら 0。
      # 新しい worktree では {1} が空の SHA になるので対象外（mise run setup が入れる）。
      run: |
        [ "{3}" = "1" ] || exit 0
        case "{1}" in 0000000000000000000000000000000000000000) exit 0 ;; esac
        git diff --quiet {1} {2} -- bun.lock || bun install --frozen-lockfile
