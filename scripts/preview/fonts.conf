<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for the preview's Chromium: the system configuration minus fonts under /mnt.
  On WSL a user configuration that adds /mnt/c/Windows/Fonts makes every font fallback read
  those files across the Windows mount, which stalled the page for several seconds and timed
  out the wait for the custom elements. Body text is drawn with the bundled Noto Sans JP; the
  system fonts still draw code blocks and glyphs it lacks, so their faces can differ on a
  machine whose only matching fonts were under /mnt. Elsewhere /mnt holds no fonts and this is
  the system configuration unchanged. render.ts passes this file only when the system
  configuration it includes exists.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/mnt/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
